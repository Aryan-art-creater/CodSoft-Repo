<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 20% 10%, #1b2735 0%, #090a0f 60%);
    padding: 20px;
  }

  .calculator {
    width: 100%;
    max-width: 360px;
    background: #101218;
    border-radius: 28px;
    padding: 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }

  .display {
    text-align: right;
    padding: 18px 10px 20px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    overflow: hidden;
  }

  .history {
    color: #7d8695;
    font-size: 18px;
    min-height: 24px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .current {
    color: #f5f7fa;
    font-size: 52px;
    font-weight: 300;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .current::-webkit-scrollbar { display: none; }

  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  button {
    border: none;
    outline: none;
    border-radius: 50%;
    aspect-ratio: 1;
    font-size: 26px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    color: #f2f4f8;
    background: #2a2e38;
    transition: transform .05s ease, filter .15s ease, background .15s ease;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  button:hover  { filter: brightness(1.15); }
  button:active { transform: scale(.93); filter: brightness(1.3); }

  .fn   { background: #1e222b; color: #8ab4f8; font-size: 22px; }
  .op   { background: #ff9f0a; color: #fff; }
  .op.active { background: #fff; color: #ff9f0a; }

  .zero {
    grid-column: span 2;
    border-radius: 999px;
    aspect-ratio: auto;
    justify-content: flex-start;
    padding-left: 30px;
  }

  .pressed { transform: scale(.93); filter: brightness(1.3); }
</style>
</head>
<body>

<div class="calculator">
  <div class="display">
    <div class="history" id="history"></div>
    <div class="current" id="current">0</div>
  </div>

  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="toggle-sign">+/−</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-operator="/">÷</button>

    <button data-digit="7">7</button>
    <button data-digit="8">8</button>
    <button data-digit="9">9</button>
    <button class="op" data-operator="*">×</button>

    <button data-digit="4">4</button>
    <button data-digit="5">5</button>
    <button data-digit="6">6</button>
    <button class="op" data-operator="-">−</button>

    <button data-digit="1">1</button>
    <button data-digit="2">2</button>
    <button data-digit="3">3</button>
    <button class="op" data-operator="+">+</button>

    <button class="zero" data-digit="0">0</button>
    <button data-action="decimal">.</button>
    <button class="op" data-action="equals">=</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  const currentEl  = document.getElementById("current");
  const historyEl  = document.getElementById("history");
  const opButtons  = document.querySelectorAll("[data-operator]");

  let current = "0";        // string being typed
  let accumulator = null;   // stored number
  let pendingOp = null;     // stored operator
  let justEvaluated = false;

  const OP_SYMBOL = { "+": "+", "-": "−", "*": "×", "/": "÷" };

  // ---------- helpers ----------

  function compute(a, b, op) {
    switch (op) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/": return b === 0 ? NaN : a / b;
    }
  }

  // Trim float noise: 0.1 + 0.2 -> 0.3, and format for display
  function formatNumber(value) {
    if (typeof value !== "number" || Number.isNaN(value)) return "Error";
    if (!Number.isFinite(value)) return "Error";
    let n = Math.abs(value) < 1e-12 ? 0 : value; // avoid -0 / tiny floats
    n = parseFloat(n.toPrecision(12));
    if (Math.abs(n) >= 1e12 || (n !== 0 && Math.abs(n) < 1e-9)) {
      return n.toExponential(6).replace(/\.?0+e/, "e");
    }
    return String(n);
  }

  function render() {
    // Add thousands separators to the integer part while typing
    if (current === "Error") {
      currentEl.textContent = "Error";
      return;
    }
    const [intPart, ...rest] = current.split(".");
    const grouped = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    currentEl.textContent = rest.length ? grouped + "." + rest.join("") : grouped;
  }

  function setError() {
    current = "Error";
    accumulator = null;
    pendingOp = null;
    historyEl.textContent = "";
    clearActiveOp();
    render();
    justEvaluated = true; // next digit starts fresh
  }

  function clearActiveOp() {
    opButtons.forEach(b => b.classList.remove("active"));
  }

  // ---------- core actions ----------

  function inputDigit(d) {
    if (current === "Error" || justEvaluated) {
      current = d;
      historyEl.textContent = "";
      justEvaluated = false;
    } else if (current === "0") {
      current = d;
    } else if (current === "-0") {
      current = "-" + d;
    } else {
      if (current.replace("-", "").replace(".", "").length >= 12) return; // digit cap
      current += d;
    }
    render();
  }

  function inputDecimal() {
    if (current === "Error" || justEvaluated) {
      current = "0.";
      historyEl.textContent = "";
      justEvaluated = false;
    } else if (!current.includes(".")) {
      current += ".";
    }
    render();
  }

  function clearAll() {
    current = "0";
    accumulator = null;
    pendingOp = null;
    justEvaluated = false;
    historyEl.textContent = "";
    clearActiveOp();
    render();
  }

  function toggleSign() {
    if (current === "Error") return;
    if (current.startsWith("-")) current = current.slice(1);
    else if (current !== "0") current = "-" + current;
    render();
  }

  function percent() {
    if (current === "Error") return;
    const n = parseFloat(current);
    current = formatNumber(n / 100);
    render();
  }

  function applyOperator(op, btn) {
    if (current === "Error") return;
    const value = parseFloat(current);
    justEvaluated = false;

    if (accumulator !== null && pendingOp !== null && !justTypedOperator) {
      const result = compute(accumulator, value, pendingOp);
      if (Number.isNaN(result) || !Number.isFinite(result)) { setError(); return; }
      accumulator = result;
      current = formatNumber(result);
    } else {
      accumulator = value;
    }

    pendingOp = op;
    justTypedOperator = true;

    historyEl.textContent = formatNumber(accumulator) + " " + OP_SYMBOL[op];
    clearActiveOp();
    if (btn) btn.classList.add("active");
    render();
  }

  let justTypedOperator = false;

  function equals() {
    if (current === "Error" || pendingOp === null) return;
    const value = parseFloat(current);
    const result = compute(accumulator, value, pendingOp);
    if (Number.isNaN(result) || !Number.isFinite(result)) { setError(); return; }

    historyEl.textContent =
      formatNumber(accumulator) + " " + OP_SYMBOL[pendingOp] + " " + formatNumber(value) + " =";

    current = formatNumber(result);
    accumulator = null;
    pendingOp = null;
    justEvaluated = true;
    justTypedOperator = false;
    clearActiveOp();
    render();
  }

  // Override: digits/decimals typed right after an operator start a new number
  const originalInputDigit = inputDigit;
  inputDigit = function (d) {
    if (justTypedOperator) { current = "0"; justTypedOperator = false; clearActiveOp(); }
    originalInputDigit(d);
  };
  const originalDecimal = inputDecimal;
  inputDecimal = function () {
    if (justTypedOperator) { current = "0"; justTypedOperator = false; clearActiveOp(); }
    originalDecimal();
  };

  // ---------- wire up buttons ----------

  document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const d = btn.dataset.digit;
      const op = btn.dataset.operator;
      const action = btn.dataset.action;

      if (d !== undefined) inputDigit(d);
      else if (op !== undefined) applyOperator(op, btn);
      else switch (action) {
        case "clear":       clearAll();     break;
        case "toggle-sign": toggleSign();   break;
        case "percent":     percent();      break;
        case "decimal":     inputDecimal(); break;
        case "equals":      equals();       break;
      }
    });
  });

  // ---------- keyboard support ----------

  document.addEventListener("keydown", (e) => {
    let selector = null;

    if (/^[0-9]$/.test(e.key)) {
      inputDigit(e.key);
      selector = `[data-digit="${e.key}"]`;
    } else if (e.key === "." || e.key === ",") {
      inputDecimal();
      selector = '[data-action="decimal"]';
    } else if (["+", "-", "*", "/"].includes(e.key)) {
      applyOperator(e.key, document.querySelector(`[data-operator="${e.key}"]`));
      selector = `[data-operator="${e.key}"]`;
    } else if (e.key === "Enter" || e.key === "=") {
      e.preventDefault();
      equals();
      selector = '[data-action="equals"]';
    } else if (e.key === "Backspace") {
      if (!justEvaluated && current !== "Error" && !justTypedOperator) {
        current = current.length > 1 ? current.slice(0, -1) : "0";
        if (current === "-") current = "0";
        render();
      }
      return;
    } else if (e.key === "Escape" || e.key.toLowerCase() === "c") {
      clearAll();
      selector = '[data-action="clear"]';
    } else if (e.key === "%") {
      percent();
      selector = '[data-action="percent"]';
    }

    if (selector) {
      const btn = document.querySelector(selector);
      if (btn) {
        btn.classList.add("pressed");
        setTimeout(() => btn.classList.remove("pressed"), 100);
      }
    }
  });

  render();
})();
</script>

</body>
</html>
